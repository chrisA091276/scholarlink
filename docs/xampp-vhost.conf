# Copy into the authorized Apache configuration and adjust the path.
<VirtualHost *:80>
    ServerName scholarlink.test
    DocumentRoot "C:/Users/Admin/Desktop/ASSAXC/public"
    <Directory "C:/Users/Admin/Desktop/ASSAXC/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/scholarlink-error.log"
    CustomLog "logs/scholarlink-access.log" combined
</VirtualHost>
